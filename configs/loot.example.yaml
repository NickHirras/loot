# Loot configuration.
#
# Copy to ./loot.yaml (the default path) or pass --config <path>.
# Every field has a sensible default; an empty file is a valid config.
#
# Environment variables override the file. Useful in Docker:
#   LOOT_LISTEN, LOOT_DATA_DIR, LOOT_RULES_PATH, LOOT_DEV_ENABLED,
#   LOOT_DISPLAY_CURRENCY, LOOT_HOME_COUNTRY, LOOT_FX_ENABLED,
#   LOOT_CHEST_ENABLED, LOOT_CHEST_AUTO_OPEN_AFTER_HOURS,
#   LOOT_REVENUECAT_SECRET, LOOT_REVENUECAT_ENABLED,
#   LOOT_FLATHUB_APPS (comma separated), LOOT_FLATHUB_BACKFILL_DAYS,
#   LOOT_APPSTORE_KEY_ID, LOOT_APPSTORE_ISSUER_ID, LOOT_APPSTORE_PRIVATE_KEY_PATH,
#   LOOT_APPSTORE_VENDOR_NUMBER, LOOT_APPSTORE_APPS, LOOT_APPSTORE_BACKFILL_DAYS,
#   LOOT_GOOGLEPLAY_SERVICE_ACCOUNT_JSON_PATH, LOOT_GOOGLEPLAY_BUCKET,
#   LOOT_GOOGLEPLAY_PACKAGES, LOOT_GOOGLEPLAY_BACKFILL_MONTHS,
#   LOOT_PLAYVITALS_ENABLED, LOOT_PLAYVITALS_PACKAGES, LOOT_PLAYVITALS_BACKFILL_DAYS,
#   LOOT_SENTRY_ENABLED, LOOT_SENTRY_CLIENT_SECRET,
#   LOOT_CRASH_ENABLED, LOOT_CRASH_SECRET

# HTTP bind address for the API, websocket and dashboard.
listen: ":8080"

# Where loot.db lives. Mount this as a volume in Docker.
data_dir: "./data"

# Optional path to a custom rarity rules file. Leave empty to use the rules
# embedded in the binary (see internal/rules/default.yaml for the format).
rules_path: ""

# The currency the vault reports in (ISO 4217). Every event keeps the amount
# and currency its source reported; Loot stores a converted copy alongside it.
display_currency: "USD"

# Where you are, as an ISO 3166-1 alpha-2 code. The Hearth's globe flies every
# live drop home to this country's capital. Leave empty and Loot uses your
# biggest settlement instead, which is right for most people.
home_country: ""

fx:
  # Fetch daily reference rates from the ECB (via frankfurter.app, no API key)
  # every 12 hours and cache them in the database. Set false to work purely
  # from the rate snapshot embedded in the binary — fine if you only ever earn
  # in one currency, or if the host has no outbound network.
  enabled: true

chest:
  # Ledger sources report a whole day at once. Rather than firing a hundred
  # drops at 3am, Loot files them into that day's chest and opens it as one
  # cascade. Set false to publish every drop the moment it is ingested.
  enabled: true
  # Open a chest automatically once its day is this many hours old, measured
  # from midnight UTC of the chest's own day. 36 means yesterday's chest opens
  # by itself around noon today. 0 waits for you to open it.
  auto_open_after_hours: 36

sources:
  revenuecat:
    # The webhook is mounted at POST /hooks/revenuecat unless disabled.
    enabled: true
    # When set, RevenueCat must send `Authorization: Bearer <secret>`.
    # Strongly recommended: without it, anyone who can reach the endpoint can
    # inject drops. Leave empty only on a trusted private network.
    secret: ""

  flathub:
    # Flatpak application IDs to watch. Loot polls the public stats API hourly
    # and emits one "install" event per app per completed day.
    apps: []
    # - org.gnome.Calculator
    # - org.example.YourApp

    # How many past days the very first poll emits, so a fresh install does not
    # fire six months of drops at once. 0 seeds the cursor and emits nothing.
    # Override once at startup with `loot serve --since 2026-01-01`.
    backfill_days: 7

  appstore:
    # App Store Connect sales reports, polled hourly. Create a team API key
    # with the "Sales and Reports" role (shown as "Sales" in older accounts)
    # under Users and Access > Integrations > App Store Connect API, download
    # the .p8 once, and take the vendor number from Payments and Financial
    # Reports. `loot check` verifies all four fields against Apple in one go.
    key_id: ""
    issuer_id: ""
    private_key_path: ""    # e.g. /etc/loot/AuthKey_2X9R4HXF34.p8
    vendor_number: ""       # e.g. "80123456"
    # Optional: restrict ingest to these Apple IDs (numeric app ids).
    apps: []
    # How many past days the first run reads, each landing as its own chest.
    # Sales reports are available for roughly a year; 30 gives the vault some
    # history without a flood. Override once with `loot serve --since`.
    backfill_days: 30

  googleplay:
    # Google Play reports. Play has no sales API: it writes monthly CSV reports
    # into a private Cloud Storage bucket. Create a service account in Google
    # Cloud, download its JSON key, then invite that service account's email in
    # Play Console > Users and permissions and give it "View app information"
    # and "View financial data".
    service_account_json_path: ""   # e.g. /etc/loot/play-reports.json
    # The bucket id, from Play Console > Download reports > Statistics >
    # "Copy Cloud Storage URI". A gs:// prefix is accepted and stripped.
    bucket: ""                      # e.g. pubsite_prod_rev_01234567890
    # Optional: restrict ingest to these package names.
    packages: []
    # - com.example.yourapp
    # How many monthly reports each poll reads, counting the current month. The
    # first poll turns every settled day in that window into a chest, so 2 is
    # about six weeks of history without burying the feed.
    backfill_months: 2

  microsoftstore:
    # Microsoft Store analytics via Partner Center. Register an app in Entra
    # (Azure AD), then associate it in Partner Center > Account settings > User
    # management > Azure AD applications with the Manager role.
    # See docs/sources/microsoftstore.md.
    tenant_id: ""
    client_id: ""
    client_secret: ""
    # Optional: restrict to these Store IDs (e.g. 9NBLGGH4R315); empty = all.
    apps: []
    backfill_days: 30

  snapcraft:
    # Snap Store metrics. Export a login with:
    #   snapcraft export-login --snaps=<name> --acls=package_access,package_metrics ./snapcraft-login
    # See docs/sources/snapcraft.md.
    snaps: []
    # - my-snap
    login_path: ""                  # e.g. /etc/loot/snapcraft-login
    backfill_days: 30

  github:
    # Stars, forks, issues, pull requests and releases — polled every 10 min,
    # and in real time if you point a GitHub webhook at POST /hooks/github.
    # See docs/sources/github.md.
    repos: []
    # - NickHirras/loot
    token: ""                       # optional; raises the rate limit, needed for private repos
    webhook_secret: ""              # verifies X-Hub-Signature-256 on /hooks/github
    backfill_days: 30

  webhook:
    # Generic webhook at POST /hooks/webhook: anything that can POST JSON can
    # drop loot. See docs/sources/webhook.md.
    enabled: false
    secret: ""

  # ------------------------------------------------------------------ crashes
  # The three ways crashes reach Loot. A crash never makes a drop of its own —
  # instead, a crash cluster that breaks away from its own baseline becomes a
  # **boss**: a named monster with a health bar that drains as your fix rolls
  # out, and pays an epic drop when it dies. See docs/bosses.md and
  # docs/sources/crashes.md.

  playvitals:
    # Android vitals: daily crash and ANR counts per app version, from the
    # Google Play Developer Reporting API. This is the best crash source Loot
    # has, because it is the only one that can say "I looked, and there were
    # none" — which is what lets a boss be *slain* rather than just fade away.
    #
    # It reuses sources.googleplay.service_account_json_path, so there is only
    # ever one Play credential to configure. Two extra steps though:
    #   1. enable playdeveloperreporting.googleapis.com in the Cloud project
    #      that owns the service account (this is the step everybody misses);
    #   2. in Play Console > Users and permissions, grant that service account
    #      "View app information and download bulk reports (read-only)".
    enabled: false
    # Package names to watch. Empty falls back to sources.googleplay.packages,
    # which is usually the same list. Vitals are per app — there is no
    # "every app" query — so one of the two lists must be set.
    packages: []
    # - com.example.yourapp
    # How far back the first poll reads. 30 is exactly enough for the boss
    # engine's 28-day baseline to exist on the very first evaluation.
    backfill_days: 30

  sentry:
    # Sentry webhooks at POST /hooks/sentry. In Sentry: Settings > Developer
    # Settings > Custom Integrations > Internal Integration, set the webhook
    # URL to https://<your loot>/hooks/sentry, tick the "issue" webhook, give
    # it Issue & Event read permission, and paste the Client Secret below.
    # Resolving an issue in Sentry slays the boss in Loot.
    enabled: false
    client_secret: ""

  crash:
    # Generic crash receiver at POST /hooks/crash, for everything else —
    # including Crashlytics, which has no data API at all. docs/sources/crashes.md
    # has a Firebase Cloud Function that relays velocity alerts here in about
    # twenty lines.
    #
    #   curl -X POST http://localhost:8080/hooks/crash \
    #     -H 'Authorization: Bearer hunter2' \
    #     -d '{"app":"com.example.app","version":"2.3.1","crashes":312,
    #          "users_affected":91,"boss":true}'
    enabled: false
    secret: ""

dev:
  # Mounts POST /api/dev/fake and shows the dev panel in the dashboard, for
  # testing sounds and animations. Keep this off in production.
  enabled: false

demo:
  # Demo mode fills a *separate* database (<data_dir>/demo.db) with a plausible
  # four months of history for three fictional apps, then keeps emitting events
  # while it runs. It never opens loot.db and never contacts a real store, so it
  # is safe to leave a demo running next to the real thing.
  #
  # Usually you want the flag rather than this file: `loot serve --demo`, or
  # LOOT_DEMO=1 in a container. `loot demo reset` deletes demo.db.
  enabled: false
  # Fixing the seed fixes the world: the same seed always produces the same
  # history, which is what makes screenshots reproducible.
  seed: 20260818
  # How fast the live emitter runs. 1 is real time; 5 is five times faster,
  # which is the setting for recording a video.
  pace: 1
  # How much history the first run seeds, in days.
  days: 120
