# Loot default rarity rules.
#
# Evaluation order:
#   1. The first non-floor rule whose `match` holds wins and sets the drop.
#   2. Every matching `floor: true` rule may then RAISE the rarity (never lower
#      it) and relabel the drop. That is how "a first-ever country is at least
#      rare" works without repeating it in every rule.
#   3. If nothing matched, `fallback` applies.
#
# Match fields (all optional, all must hold):
#   source / sources, kind / kinds, app, min_amount, max_amount, min_quantity,
#   is_ledger, has_country, country_first, record_high, payload_match.
#
# `country_first` is true when this is the first event ever stored from that
# country. `record_high` is true when the event's quantity beats every previous
# event for the same source+app+kind. `payload_match` takes dotted JSON paths
# into the raw source payload.
#
# Title and subtitle are Go templates over:
#   .Source .SourceName .Kind .App .Day .Country .Flag .Amount .AmountFmt .Currency
#   .AmountBase .AmountBaseFmt (display currency) .Quantity .QuantityFmt
#   .Payload .BaseTitle (floor rules only)

rules:
  # ---------------------------------------------------------------- RevenueCat
  # Bad news first, so churn is never mistaken for revenue.
  - name: revenuecat-churn
    match:
      source: revenuecat
      kinds: [cancellation, expiration, billing_issue]
    then:
      rarity: cursed
      title: "Subscriber lost"
      subtitle: "{{.Kind}}{{if .App}} · {{.App}}{{end}}"
      xp: 5

  - name: revenuecat-winback
    match:
      source: revenuecat
      kind: uncancellation
    then:
      rarity: rare
      title: "A subscriber returns"
      subtitle: "{{.App}}"
      xp: 120

  - name: revenuecat-annual
    match:
      source: revenuecat
      kinds: [purchase]
      payload_match:
        event.period_type: ANNUAL
    then:
      rarity: rare
      title: "New annual subscriber"
      subtitle: "{{.AmountFmt}}{{if .App}} · {{.App}}{{end}}"
      xp: 150

  - name: revenuecat-high-value
    match:
      source: revenuecat
      kinds: [purchase]
      min_amount: 20
    then:
      rarity: rare
      title: "New subscriber"
      subtitle: "{{.AmountFmt}}{{if .App}} · {{.App}}{{end}}"
      xp: 120

  - name: revenuecat-purchase
    match:
      source: revenuecat
      kinds: [purchase]
    then:
      rarity: uncommon
      title: "New subscriber"
      subtitle: "{{.AmountFmt}}{{if .App}} · {{.App}}{{end}}"
      xp: 25

  - name: revenuecat-renewal
    match:
      source: revenuecat
      kind: renewal
    then:
      rarity: common
      title: "Renewal"
      subtitle: "{{.AmountFmt}}{{if .App}} · {{.App}}{{end}}"
      xp: 10

  - name: revenuecat-product-change
    match:
      source: revenuecat
      kind: product_change
    then:
      rarity: uncommon
      title: "Plan changed"
      subtitle: "{{.App}}"
      xp: 20

  # ------------------------------------------------- Ledger day summaries
  # Ledger sources (App Store Connect, Google Play) store their detail as
  # silent row events and emit one `sales_day` summary per app per day. These
  # rules match on kind alone, so every ledger source gets them for free.
  - name: sales-day-record
    match:
      kind: sales_day
      record_high: true
    then:
      rarity: epic
      title: "Best day ever on {{.SourceName}}"
      subtitle: "{{.QuantityFmt}} sales · {{.AmountFmt}}{{if .App}} · {{.App}}{{end}}"
      xp: 300

  - name: sales-day-big
    match:
      kind: sales_day
      min_amount: 100
    then:
      rarity: rare
      title: "{{.QuantityFmt}} sales · {{.AmountFmt}}"
      subtitle: "a big day{{if .App}} for {{.App}}{{end}} on {{.SourceName}}"
      xp: 120

  - name: sales-day
    match:
      kind: sales_day
    then:
      rarity: common
      title: "{{.QuantityFmt}} sales · {{.AmountFmt}}"
      subtitle: "{{if .App}}{{.App}} · {{end}}{{.SourceName}}"
      xp: 10

  # ------------------------------------------------------- Install day totals
  # Sources that report installs a whole day at a time (Google Play, Flathub,
  # Snapcraft) emit one `installs_day` per app per day, alongside a silent
  # `install` row that carries the count. The generic rules below are matched
  # on kind alone, so any source that adopts the same event gets them for free;
  # the Flathub pair sits first only to call the store by its own name.
  - name: flathub-record-day
    match:
      source: flathub
      kind: installs_day
      record_high: true
    then:
      rarity: epic
      title: "Best day ever on Flathub"
      subtitle: "{{.QuantityFmt}} installs of {{.App}}"
      xp: 300

  - name: flathub-installs
    match:
      source: flathub
      kind: installs_day
    then:
      rarity: common
      title: "{{.QuantityFmt}} installs on Flathub"
      subtitle: "{{.App}}"
      xp: 10

  - name: installs-day-record
    match:
      kind: installs_day
      record_high: true
    then:
      rarity: epic
      title: "Best install day on {{.SourceName}}"
      subtitle: "{{.QuantityFmt}} installs{{if .App}} · {{.App}}{{end}}"
      xp: 300

  - name: installs-day
    match:
      kind: installs_day
    then:
      rarity: common
      title: "{{.QuantityFmt}} installs on {{.SourceName}}"
      subtitle: "{{.App}}"
      xp: 10

  # -------------------------------------------------------------- Settlements
  # The pipeline synthesizes one of these the first time an event carries a
  # country Loot has never seen, including from silent ledger rows.
  - name: settlement
    match:
      source: loot
      kind: settlement
    then:
      rarity: rare
      title: "New settlement: {{.Flag}} {{.Country}}"
      subtitle: "first customer via {{.Payload.via}}"
      xp: 250

  # --------------------------------------------------------------------- Loot
  # Loot's own events: things Loot noticed about your data rather than things a
  # store reported. A quest you finished, a mystery you explained.
  #
  # A month's quest is worth more than a week's, which is what `scope` in the
  # payload is for — the quest engine writes it, and the more specific rule
  # sits first so it wins.
  - name: quest-complete-month
    match:
      source: loot
      kind: quest_complete
      payload_match:
        scope: month
    then:
      rarity: epic
      title: "Quest complete: {{.Payload.title}}"
      subtitle: "{{.Payload.detail}}"
      xp: 500

  - name: quest-complete
    match:
      source: loot
      kind: quest_complete
    then:
      rarity: rare
      title: "Quest complete: {{.Payload.title}}"
      subtitle: "{{.Payload.detail}}"
      xp: 200

  # Writing down what you think happened is the whole feature; the drop is the
  # thank-you note.
  - name: mystery-solved
    match:
      source: loot
      kind: mystery_solved
    then:
      rarity: uncommon
      title: "Mystery solved"
      subtitle: "{{.Payload.title}}"
      xp: 75

  # -------------------------------------------------------------------- GitHub
  - name: github-release
    match: {source: github, kind: release}
    then: {rarity: rare, title: "Release shipped: {{.Payload.tag}}", subtitle: "{{.App}}", xp: 150}
  - name: github-star-milestone
    match: {source: github, kind: stars_milestone}
    then: {rarity: epic, title: "{{.QuantityFmt}} stars on {{.App}}", subtitle: "milestone", xp: 400}
  - name: github-star
    match: {source: github, kind: star}
    then: {rarity: common, title: "New stargazer", subtitle: "{{.App}}{{if .Payload.user}} · {{.Payload.user}}{{end}}", xp: 5}
  - name: github-fork
    match: {source: github, kind: fork}
    then: {rarity: common, title: "Forked", subtitle: "{{.App}}", xp: 5}
  - name: github-issue-opened
    match: {source: github, kind: issue_opened}
    then: {rarity: uncommon, title: "A quest appears: #{{.Payload.number}}", subtitle: "{{.Payload.title}}", xp: 15}
  - name: github-issue-closed
    match: {source: github, kind: issue_closed}
    then: {rarity: uncommon, title: "Issue slain: #{{.Payload.number}}", subtitle: "{{.Payload.title}}", xp: 30}
  - name: github-pr-merged
    match: {source: github, kind: pr_merged}
    then: {rarity: rare, title: "PR merged: #{{.Payload.number}}", subtitle: "{{.Payload.title}}", xp: 60}
  - name: github-pr-opened
    match: {source: github, kind: pr_opened}
    then: {rarity: uncommon, title: "PR opened: #{{.Payload.number}}", subtitle: "{{.Payload.title}}", xp: 20}

  # ----------------------------------------------------------- Generic webhook
  # POST /hooks/webhook may name its own rarity in the payload; otherwise it
  # falls through to the kind-based and fallback rules like any other source.
  - name: webhook-legendary
    match: {source: webhook, payload_match: {rarity: legendary}}
    then: {rarity: legendary, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 1000}
  - name: webhook-epic
    match: {source: webhook, payload_match: {rarity: epic}}
    then: {rarity: epic, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 300}
  - name: webhook-rare
    match: {source: webhook, payload_match: {rarity: rare}}
    then: {rarity: rare, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 100}
  - name: webhook-uncommon
    match: {source: webhook, payload_match: {rarity: uncommon}}
    then: {rarity: uncommon, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 25}
  - name: webhook-cursed
    match: {source: webhook, payload_match: {rarity: cursed}}
    then: {rarity: cursed, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 5}
  - name: webhook-common
    match: {source: webhook, payload_match: {rarity: common}}
    then: {rarity: common, title: "{{.Payload.title}}", subtitle: "{{.Payload.subtitle}}", xp: 10}

  # ----------------------------------------------------- Dev / synthetic drops
  # POST /api/dev/fake emits source=dev with kind set to the desired rarity, so
  # the UI and sound design can be exercised without waiting for real money.
  - name: dev-cursed
    match: {source: dev, kind: cursed}
    then: {rarity: cursed, title: "A cursed drop", subtitle: "synthetic test event"}
  - name: dev-legendary
    match: {source: dev, kind: legendary}
    then: {rarity: legendary, title: "A legendary drop", subtitle: "synthetic test event"}
  - name: dev-epic
    match: {source: dev, kind: epic}
    then: {rarity: epic, title: "An epic drop", subtitle: "synthetic test event"}
  - name: dev-rare
    match: {source: dev, kind: rare}
    then: {rarity: rare, title: "A rare drop", subtitle: "synthetic test event"}
  - name: dev-uncommon
    match: {source: dev, kind: uncommon}
    then: {rarity: uncommon, title: "An uncommon drop", subtitle: "synthetic test event"}
  - name: dev-common
    match: {source: dev, kind: common}
    then: {rarity: common, title: "A common drop", subtitle: "synthetic test event"}

  # Floor rules (`floor: true`) are still supported by the engine — they run
  # after a winner is chosen and may only RAISE rarity — but the defaults no
  # longer use one for new countries. A first-ever country now produces its own
  # settlement drop above, so the event that revealed it keeps its own headline.

fallback:
  rarity: common
  title: "{{.Source}} · {{.Kind}}"
  subtitle: "{{.App}}"
  xp: 10
