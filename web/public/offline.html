<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#090b10" />
    <title>Loot — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0d1018, #090b10);
        color: #e8ecf6;
        font:
          15px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 28rem;
      }
      .gem {
        font-size: 2.5rem;
        color: #ffc23d;
        text-shadow: 0 0 24px rgba(255, 194, 61, 0.45);
      }
      h1 {
        margin: 0.5rem 0 0.25rem;
        font-size: 1.3rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0.25rem 0 1.25rem;
        color: #9aa4bc;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 1px solid #232a3a;
        background: #171c28;
        border-radius: 8px;
        padding: 0.45rem 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="gem" aria-hidden="true">&#9670;</div>
      <h1>Loot is offline</h1>
      <p>
        The dashboard needs a connection to your Loot server. Numbers are never cached, so nothing here would be
        current anyway.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
